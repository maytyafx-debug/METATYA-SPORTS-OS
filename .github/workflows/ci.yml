name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - fix/tenant-security-role-alignment

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: volleyball_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d volleyball_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Tenant authorization and volleyball scoring tests
        run: npm test
      - name: PostgreSQL migration, RLS and RPC integration
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: volleyball_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -f tests/volleyball-db-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261119180000_010_volleyball_operational_module.sql
          psql -v ON_ERROR_STOP=1 -f tests/volleyball-db-integration.sql
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Production build
        run: npm run build
